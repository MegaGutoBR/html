<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODELO DE CAIXA</title>
    <style> 
        H1 {
            background-color: #b8bbc9;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: #000000;
            padding: 10px;
            margin: 10px auto;
            outline: 5px dashed red
        }
        
        a {
            color: #ff0000;
            border-style: solid;
            border-width: 5px;
            border-color: #000000;
            padding: 5px;
        }
            
    </style>
</head>
<body>
    <h1> Exemplo de Caixa Box-Level</h1>
    <p>paragrafo é box-level.
    Links são inline-level. <a href="#">ablabla</a>
    </p>



    
</body>
</html>
